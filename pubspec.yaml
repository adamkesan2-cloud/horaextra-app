name: horaextra_app
description: Aplicativo HoraExtra - Serviços sob demanda
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP e Utilitários
  http: ^1.1.0
  http_parser: ^4.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  
  # UI e Ícones
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9

  # Gerenciamento de Estado
  provider: ^6.1.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Cache e Performance
  shared_preferences: ^2.3.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^10.0.0

  # Imagens e Arquivos
  image_picker: ^1.1.2
  image_picker_web: ^4.0.0
  file_picker: ^8.1.3
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.3.0

  # Mapas — flutter_map + OpenStreetMap (atualizado)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.0.0

  # Localização GPS real (versões corrigidas)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Animações
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0

  # WebSocket para tempo real
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Assets (se tiver imagens locais)
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/