<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="metal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dddddd"/>
      <stop offset="100%" stop-color="#999999"/>
    </radialGradient>
  </defs>

  <g transform="translate(20,10) rotate(-10 50 50)">

    <!-- Caixa externa -->
    <circle cx="50" cy="50" r="42"
            fill="url(#metal)"
            stroke="#111"
            stroke-width="3"/>

    <!-- Anel interno -->
    <circle cx="50" cy="50" r="36"
            fill="white"
            stroke="#666"
            stroke-width="1.5"/>

    <!-- Marcadores principais -->
    <line x1="50" y1="14" x2="50" y2="22" stroke="#111" stroke-width="2"/>
    <line x1="86" y1="50" x2="78" y2="50" stroke="#111" stroke-width="2"/>
    <line x1="50" y1="86" x2="50" y2="78" stroke="#111" stroke-width="2"/>
    <line x1="14" y1="50" x2="22" y2="50" stroke="#111" stroke-width="2"/>

    <!-- Marcadores menores -->
    <g stroke="#777" stroke-width="1">
      <line x1="50" y1="18" x2="50" y2="21"/>
      <line x1="50" y1="82" x2="50" y2="79"/>
      <line x1="18" y1="50" x2="21" y2="50"/>
      <line x1="82" y1="50" x2="79" y2="50"/>
    </g>

    <!-- Submostrador interno -->
    <circle cx="50" cy="50" r="15"
            fill="#f5f5f5"
            stroke="#bbb"
            stroke-width="1"/>

    <!-- Ponteiro central fixo -->
    <circle cx="50" cy="50" r="3.5" fill="#111"/>

    <!-- Ponteiros animados -->
    <line id="hour" x1="50" y1="50" x2="50" y2="32"
          stroke="#111" stroke-width="3" stroke-linecap="round"/>
    <line id="minute" x1="50" y1="50" x2="70" y2="50"
          stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
    <line id="second" x1="50" y1="50" x2="75" y2="50"
          stroke="#999" stroke-width="1.5" stroke-linecap="round"/>

  </g>

  <!-- Texto elegante -->
  <text x="130"
        y="70"
        font-family="Georgia, serif"
        font-size="38"
        font-weight="600"
        fill="#111">
    Hora
  </text>

  <text x="215"
        y="70"
        font-family="Georgia, serif"
        font-size="38"
        font-weight="400"
        fill="#777">
    Extra
  </text>

  <script type="text/javascript"><![CDATA[
    function updateClock(){
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDeg = seconds * 6; // 360/60
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = hours * 30 + minutes * 0.5;

      document.getElementById("second").setAttribute("transform", "rotate("+secondDeg+" 50 50)");
      document.getElementById("minute").setAttribute("transform", "rotate("+minuteDeg+" 50 50)");
      document.getElementById("hour").setAttribute("transform", "rotate("+hourDeg+" 50 50)");
    }

    setInterval(updateClock, 1000);
    updateClock();
  ]]></script>
</svg>